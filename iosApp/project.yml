name: Fukaha
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    MARKETING_VERSION: 26.11.0
    CURRENT_PROJECT_VERSION: 17
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS:
      - $(inherited)
      - -framework
      - Shared
targets:
  Fukaha:
    type: application
    platform: iOS
    sources:
      - path: Fukaha
      - path: ../iosShareExtension/FukahaShareScreen.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenepoy.fukaha
        PRODUCT_NAME: Fukaha
        INFOPLIST_FILE: Fukaha/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fukaha
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_ENTITLEMENTS: Fukaha/Fukaha.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(FUKAHA_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ -z "${JAVA_HOME:-}" ] && [ -x /usr/libexec/java_home ]; then
            export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null || true)"
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    dependencies:
      - target: FukahaShare
        embed: true
        codeSign: false
      - target: FukahaAction
        embed: true
        codeSign: false
  FukahaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ../iosShareExtension
      - path: Fukaha/FukahaDesign.swift
      - path: Fukaha/FukahaMediaCache.swift
      - path: Fukaha/FukahaSettingsSnapshot.swift
      - path: Fukaha/FukahaSourcePreferences.swift
      - path: Fukaha/PrivacyInfo.xcprivacy
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ -z "${JAVA_HOME:-}" ] && [ -x /usr/libexec/java_home ]; then
            export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null || true)"
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenepoy.fukaha.share
        PRODUCT_NAME: FukahaShare
        INFOPLIST_FILE: ../iosShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fukaha
        CODE_SIGN_ENTITLEMENTS: ../iosShareExtension/FukahaShare.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(FUKAHA_SHARE_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
  FukahaAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ../iosActionExtension/Assets.xcassets
      - path: ../iosShareExtension/ShareViewController.swift
      - path: ../iosShareExtension/FukahaShareScreen.swift
      - path: Fukaha/FukahaDesign.swift
      - path: Fukaha/FukahaMediaCache.swift
      - path: Fukaha/FukahaSettingsSnapshot.swift
      - path: Fukaha/FukahaSourcePreferences.swift
      - path: Fukaha/PrivacyInfo.xcprivacy
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ -z "${JAVA_HOME:-}" ] && [ -x /usr/libexec/java_home ]; then
            export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null || true)"
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenepoy.fukaha.action
        PRODUCT_NAME: FukahaAction
        ASSETCATALOG_COMPILER_APPICON_NAME: ActionIcon
        INFOPLIST_FILE: ../iosActionExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Clean with Fukaha"
        CODE_SIGN_ENTITLEMENTS: ../iosActionExtension/FukahaAction.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(FUKAHA_ACTION_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
  FukahaShareHarness:
    type: application
    platform: iOS
    sources:
      - path: tests/ShareHarness
      - path: ../iosShareExtension/ShareViewController.swift
      - path: ../iosShareExtension/FukahaShareScreen.swift
      - path: Fukaha/FukahaDesign.swift
      - path: Fukaha/FukahaMediaCache.swift
      - path: Fukaha/FukahaSettingsSnapshot.swift
      - path: Fukaha/FukahaSourcePreferences.swift
      - path: Fukaha/FukahaClient.swift
      - path: Fukaha/FukahaQuickShareView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenepoy.fukaha.share-harness
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        CODE_SIGNING_ALLOWED: NO
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  FukahaSharingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/SharingIntegration
    dependencies:
      - target: FukahaShareHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenepoy.fukaha.sharing-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  FukahaDiscoveryHost:
    type: application
    platform: iOS
    sources:
      - path: tests/DiscoveryHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenepoy.fukaha.discovery-host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ""
        CODE_SIGNING_ALLOWED: NO
  FukahaShareDiscoveryTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: tests/ShareDiscovery
    dependencies:
      - target: FukahaDiscoveryHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenepoy.fukaha.share-discovery-tests
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: ""
        CODE_SIGNING_ALLOWED: NO
schemes:
  FukahaShareDiscoveryTests:
    shared: true
    build:
      targets:
        Fukaha: all
        FukahaDiscoveryHost: all
    test:
      targets:
        - FukahaShareDiscoveryTests
      gatherCoverageData: false
  FukahaSharingTests:
    shared: true
    build:
      targets:
        FukahaShareHarness: all
    test:
      targets:
        - FukahaSharingTests
      gatherCoverageData: false
  Fukaha:
    shared: true
    build:
      targets:
        Fukaha: all
        FukahaShare: all
        FukahaAction: all
