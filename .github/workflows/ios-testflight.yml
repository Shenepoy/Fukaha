name: iOS TestFlight

on:
  push:
    branches: [codex/ios-share-validation]
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
      build_number:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed IPA to App Store Connect after validation
        type: boolean
        default: false
      build_number:
        description: Optional unique build number (defaults to workflow run.attempt)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number || format('{0}.{1}', github.run_number, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v5
      - name: Check signing configuration
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          IOS_ACTION_PROFILE_BASE64: ${{ secrets.IOS_ACTION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          UPLOAD_REQUESTED: ${{ inputs.upload }}
        run: |
          python3 - <<'PY'
          import os
          required = ['APPLE_TEAM_ID', 'IOS_DISTRIBUTION_P12_BASE64', 'IOS_DISTRIBUTION_P12_PASSWORD',
                      'IOS_APP_PROFILE_BASE64', 'IOS_SHARE_PROFILE_BASE64', 'IOS_ACTION_PROFILE_BASE64']
          if os.environ['UPLOAD_REQUESTED'] == 'true':
              required += ['ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_PRIVATE_KEY_BASE64']
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Configure TestFlight settings first: ' + ', '.join(missing))
          PY
          xcodebuild -version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate release configuration and shared code
        run: |
          python3 -m unittest discover -s iosApp/tests -p 'test_*.py'
          bash iosApp/scripts/test-source-preferences.sh
          if [[ "$(uname -m)" == arm64 ]]; then
            ./gradlew :shared:testAndroidHostTest :shared:iosSimulatorArm64Test
          else
            ./gradlew :shared:testAndroidHostTest :shared:iosX64Test
          fi
      - name: Validate iPhone and iPad sharing
        run: bash iosApp/scripts/test-sharing.sh
      - name: Save sharing test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fukaha-sharing-tests-${{ env.IOS_BUILD_NUMBER }}
          path: iosApp/build/Sharing-*.xcresult
          if-no-files-found: ignore
          retention-days: 14
      - name: Archive and export signed IPA
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          IOS_ACTION_PROFILE_BASE64: ${{ secrets.IOS_ACTION_PROFILE_BASE64 }}
        run: bash iosApp/scripts/build-testflight.sh
      - name: Save IPA and symbols
        uses: actions/upload-artifact@v4
        with:
          name: fukaha-testflight-${{ env.IOS_BUILD_NUMBER }}
          path: |
            dist/testflight/**/*.ipa
            iosApp/build/TestFlight/*.xcarchive/dSYMs/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash iosApp/scripts/upload-testflight.sh "dist/testflight/$IOS_BUILD_NUMBER/Fukaha.ipa"
