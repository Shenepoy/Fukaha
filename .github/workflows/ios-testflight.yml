name: iOS TestFlight

on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
      build_number:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      inspect_only:
        description: Only list existing TestFlight groups
        type: boolean
        default: false
      upload:
        description: Upload the signed IPA to App Store Connect after validation
        type: boolean
        default: false
      build_number:
        description: Optional unique build number (defaults to workflow run.attempt)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ inputs.inspect_only && 'inspect' || 'build' }}
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ inputs.inspect_only == true }}
    runs-on: ubuntu-latest
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect existing external groups
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: node iosApp/scripts/testflight-distribution.mjs inspect
  validate-shared:
    if: ${{ inputs.inspect_only != true }}
    name: Validate configuration and shared code (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate release configuration
        run: python3 -m unittest discover -s iosApp/tests -p 'test_*.py'
      - name: Test shared processing
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

  archive:
    needs: validate-shared
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number || format('{0}.{1}', github.run_number, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v5
      - name: Check signing configuration
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          IOS_ACTION_PROFILE_BASE64: ${{ secrets.IOS_ACTION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          UPLOAD_REQUESTED: ${{ inputs.upload }}
        run: |
          python3 - <<'PY'
          import os
          required = ['APPLE_TEAM_ID', 'IOS_DISTRIBUTION_P12_BASE64', 'IOS_DISTRIBUTION_P12_PASSWORD',
                      'IOS_APP_PROFILE_BASE64', 'IOS_SHARE_PROFILE_BASE64', 'IOS_ACTION_PROFILE_BASE64']
          if os.environ['UPLOAD_REQUESTED'] == 'true':
              required += ['ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_PRIVATE_KEY_BASE64']
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Configure TestFlight settings first: ' + ', '.join(missing))
          PY
          xcodebuild -version
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate native iOS shared code
        run: |
          bash iosApp/scripts/test-source-preferences.sh
          if [[ "$(uname -m)" == arm64 ]]; then
            ./gradlew :shared:iosSimulatorArm64Test
          else
            ./gradlew :shared:iosX64Test
          fi
      - name: Validate iPhone and iPad sharing
        run: bash iosApp/scripts/test-sharing.sh
      - name: Validate iOS 17 extension discovery
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 17.5
          bash iosApp/scripts/test-share-discovery.sh
      - name: Save sharing test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fukaha-sharing-tests-${{ env.IOS_BUILD_NUMBER }}
          path: |
            iosApp/build/Sharing-*.xcresult
            iosApp/build/ShareDiscovery.xcresult
            iosApp/build/discovery-runtimes.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Archive and export signed IPA
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
          IOS_ACTION_PROFILE_BASE64: ${{ secrets.IOS_ACTION_PROFILE_BASE64 }}
        run: bash iosApp/scripts/build-testflight.sh
      - name: Save IPA and symbols
        uses: actions/upload-artifact@v4
        with:
          name: fukaha-testflight-${{ env.IOS_BUILD_NUMBER }}
          path: |
            dist/testflight/**/*.ipa
            iosApp/build/TestFlight/*.xcarchive/dSYMs/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash iosApp/scripts/upload-testflight.sh "dist/testflight/$IOS_BUILD_NUMBER/Fukaha.ipa"
      - name: Distribute to existing external TestFlight group
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
        run: node iosApp/scripts/testflight-distribution.mjs distribute
      - name: Save external distribution verification
        if: ${{ inputs.upload && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: testflight-distribution-${{ env.IOS_BUILD_NUMBER }}
          path: testflight-distribution.json
          if-no-files-found: ignore
