name: Testing

on:
  push:
    tags: ["v*-testing.*"]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishing: a slower old build must never replace a newer testing build.
concurrency:
  group: testing-publish
  cancel-in-progress: false

jobs:
  version:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-testing.')
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.testing_build }}
      display: ${{ steps.version.outputs.display_version }}
      android_code: ${{ steps.version.outputs.android_code }}
      ios_build: ${{ steps.version.outputs.ios_build }}
    steps:
      - uses: actions/checkout@v5
      - name: Test channel configuration
        run: python3 -m unittest discover -s scripts/ci/tests
      - id: version
        run: python3 scripts/ci/testing_version.py

  android:
    if: github.repository == 'Shenepoy/Fukaha'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_testingBuild: ${{ needs.version.outputs.build }}
      ORG_GRADLE_PROJECT_testingVersionCode: ${{ needs.version.outputs.android_code }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate Android and shared code
        run: ./gradlew :shared:testAndroidHostTest :composeApp:testDebugUnitTest :composeApp:lintStaging --stacktrace
      - name: Build signed testing APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/testing.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing signing key}"
          : "${RELEASE_STORE_PASSWORD:?Missing store password}"
          : "${RELEASE_KEY_ALIAS:?Missing key alias}"
          : "${RELEASE_KEY_PASSWORD:?Missing key password}"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          chmod 600 "$RELEASE_STORE_FILE"
          ./gradlew :composeApp:assembleStaging --stacktrace
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs composeApp/build/outputs/apk/staging/composeApp-staging.apk)
          if [[ "$certs" == *"CN=Android Debug"* ]]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: fukaha-android-${{ needs.version.outputs.display }}
          path: composeApp/build/outputs/apk/staging/composeApp-staging.apk
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        run: echo 'Android testing APK is in this run’s artifacts. It installs as **Fukaha Testing**, alongside production.' >> "$GITHUB_STEP_SUMMARY"

  web:
    if: github.repository == 'Shenepoy/Fukaha'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: testing-web
      url: https://fukaha-shenepoy-testing.web.app
    env:
      ORG_GRADLE_PROJECT_testingBuild: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build web
        run: ./gradlew :webApp:jsBrowserTest :webApp:pwaStaticTest :webApp:jsBrowserDistribution --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fukaha-web-${{ needs.version.outputs.display }}
          path: webApp/build/dist/js/productionExecutable
          if-no-files-found: error
          retention-days: 30
      - name: Deploy isolated testing site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-testing.json
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?Missing Firebase credentials}"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          python3 scripts/ci/testing_hosting.py
          npx --yes firebase-tools@15.18.0 deploy --only hosting --config firebase.testing.json --project fukaha-shenepoy --non-interactive
          echo 'Web testing: https://fukaha-shenepoy-testing.web.app' >> "$GITHUB_STEP_SUMMARY"

  ios:
    if: github.repository == 'Shenepoy/iOS-Setup'
    needs: version
    uses: ./.github/workflows/ios-testflight.yml
    secrets: inherit
    with:
      upload: true
      build_number: ${{ needs.version.outputs.ios_build }}
