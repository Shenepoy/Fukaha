name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-and-build:
    name: Test & Assemble Debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Test CI configuration
        run: python3 -m unittest discover -s scripts/ci/tests

      - name: Unit tests + assemble debug + web bundle
        # Single invocation: one configuration, shared daemon, no redundant wrapper download.
        run: >-
          ./gradlew :shared:testAndroidHostTest :composeApp:testDebugUnitTest
          :composeApp:lintDebug :composeApp:assembleDebug
          :webApp:jsBrowserTest :webApp:pwaStaticTest :webApp:jsBrowserDistribution --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fukaha-debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error
